<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto – Terra Homes</title>

    <!-- DM SANS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --brown: #5A210F;
            --brown-hover: #71301A;
            --cream: #F8F1E8;
            --sand: #E8D8C8;
            --white: #FFFFFF;
            --black: #111111;
            --font: 'DM Sans', sans-serif;
            --title-size: 18px;
            --title-weight: 400;
            --title-spacing: .015em;
            --text-size: 13px;
            --small-size: 10.5px;
            --r-xs: 6px;
            --r-md: 16px;
            --r-lg: 22px;
            --r-xl: 20px;
            --r-pill: 100px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--cream);
            color: var(--black);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        button,
        input,
        textarea {
            font-family: var(--font);
        }

        .wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        .narrow-wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* =========================
           MOBILE NAV
        ========================= */

        .mob-nav {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: var(--cream);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 34px;
        }

            .mob-nav.open {
                display: flex;
            }

            .mob-nav a {
                font-size: 20px;
                font-weight: 400;
                letter-spacing: .02em;
                text-transform: uppercase;
                color: var(--black);
            }

        .mob-close {
            position: absolute;
            top: 22px;
            right: 28px;
            background: none;
            border: none;
            font-size: 36px;
            line-height: 1;
            color: var(--black);
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        .hd {
            width: 100%;
            z-index: 300;
            padding: 14px 32px 0;
            pointer-events: none;
        }

        .nav {
            max-width: 1400px;
            margin: 0 auto;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, .96);
            backdrop-filter: blur(8px);
            border-radius: var(--r-pill);
            padding: 4px 22px 4px 26px;
            box-shadow: 0 4px 18px rgba(60, 26, 10, .14);
            pointer-events: auto;
            overflow: visible;
        }

        .nav-logo {
            height: 52px;
            width: auto;
            transform: scale(1.35);
            transform-origin: left center;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

            .nav-links a {
                font-size: 12px;
                font-weight: 400;
                letter-spacing: .01em;
                text-transform: uppercase;
                color: var(--black);
                transition: opacity .2s ease;
            }

                .nav-links a:hover {
                    opacity: .55;
                }

        .nav-ham {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }

            .nav-ham span {
                display: block;
                width: 24px;
                height: 2px;
                background: var(--black);
                border-radius: 2px;
            }

        /* =========================
           TITLES
        ========================= */

        .page-title,
        .section-title {
            font-size: var(--title-size);
            font-weight: var(--title-weight);
            letter-spacing: var(--title-spacing);
            text-transform: uppercase;
            line-height: 1.2;
            color: var(--black);
        }

        .body-text {
            font-size: var(--text-size);
            font-weight: 400;
            line-height: 1.42;
            color: var(--black);
        }

        /* =========================
           PAGE HEAD
        ========================= */

        .page-head {
            padding: 36px 0 24px;
            text-align: center;
        }

        /* =========================
           CONTACT FORM
        ========================= */

        .contact-section {
            padding: 0 0 22px;
        }

        .contact-card {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--sand);
            border-radius: var(--r-lg);
            padding: 46px 32px 48px;
        }

        .contact-form {
            width: 100%;
            max-width: 370px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

            .field label {
                font-size: 10.5px;
                font-weight: 400;
                color: var(--black);
            }

            .field input,
            .field textarea {
                width: 100%;
                border: 1px solid var(--white);
                background: var(--white);
                border-radius: 6px;
                height: 30px;
                padding: 0 11px;
                font-size: 12px;
                color: var(--black);
                outline: none;
                box-shadow: 0 0 0 1px rgba(90, 33, 15, .08);
            }

            .field textarea {
                height: 92px;
                resize: vertical;
                padding-top: 8px;
            }

                .field input:focus,
                .field textarea:focus {
                    box-shadow: 0 0 0 1.3px rgba(90, 33, 15, .32);
                }

        .check-row {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            font-size: 10px;
            line-height: 1.2;
            color: var(--black);
        }

            .check-row input {
                margin-top: 1px;
                width: 12px;
                height: 12px;
                accent-color: var(--brown);
                flex-shrink: 0;
            }

        .form-submit {
            margin-top: 8px;
            width: 100%;
            height: 30px;
            background: var(--brown);
            color: var(--white);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10.5px;
            font-weight: 400;
            letter-spacing: .02em;
            text-transform: uppercase;
            transition: background .2s, transform .15s;
        }

            .form-submit:hover {
                background: var(--brown-hover);
                transform: translateY(-1px);
            }

        /* =========================
           CONTACT INFO
        ========================= */

        .contact-info-section {
            padding: 0 0 22px;
        }

        .contact-info-card {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--brown);
            color: var(--white);
            border-radius: var(--r-lg);
            padding: 38px 32px;
            text-align: center;
        }

        .info-block {
            margin-bottom: 18px;
        }

            .info-block:last-child {
                margin-bottom: 0;
            }

        .info-title {
            font-size: 10.5px;
            font-weight: 400;
            letter-spacing: .015em;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 4px;
            color: var(--white);
        }

        .info-text,
        .info-link {
            font-size: 11.5px;
            font-weight: 400;
            line-height: 1.35;
            color: var(--white);
        }

        .info-link {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

            .info-link:hover {
                opacity: .75;
            }

        /* =========================
           MAP
        ========================= */

        .map-section {
            padding: 0 0 54px;
        }

        .map-box {
            width: 100%;
            height: 280px;
            border-radius: var(--r-md);
            overflow: hidden;
            background: #D4C4B4;
        }

            .map-box img,
            .map-box iframe {
                width: 100%;
                height: 100%;
                border: 0;
                display: block;
                object-fit: cover;
            }

        /* =========================
           FOOTER
        ========================= */

        .ft {
            background: var(--brown);
            padding: 72px 0 48px;
            border-radius: 18px 18px 0 0;
        }

        .ft-inner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 40px;
        }

        .ft-social {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ft-soc-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: transparent;
            transition: transform .2s ease;
        }

            .ft-soc-btn:hover {
                transform: translateY(-2px);
            }

            .ft-soc-btn svg {
                width: 24px;
                height: 24px;
                fill: var(--white);
            }

        .ft-soc-id {
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -.05em;
            color: var(--white);
            line-height: 1;
        }

        .ft-logo-wrap {
            text-align: center;
        }

        .ft-logo {
            height: 68px;
            width: auto;
            margin: 0 auto;
            filter: brightness(0) invert(1);
            opacity: .92;
        }

        .ft-nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: flex-end;
        }

            .ft-nav a {
                font-size: 12px;
                font-weight: 400;
                letter-spacing: .015em;
                text-transform: uppercase;
                color: var(--white);
                transition: opacity .2s;
            }

                .ft-nav a:hover {
                    opacity: .65;
                }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 960px) {
            .wrap,
            .narrow-wrap {
                padding: 0 24px;
            }

            .hd {
                padding: 14px 24px 0;
            }

            .nav {
                min-height: 50px;
            }

            .nav-logo {
                height: 46px;
            }

            .contact-card,
            .contact-info-card {
                max-width: 100%;
            }
        }

        @media (max-width: 640px) {
            :root {
                --title-size: 16px;
            }

            .wrap,
            .narrow-wrap {
                padding: 0 18px;
            }

            .hd {
                padding: 0;
                top: 0;
            }

            .nav {
                width: 100%;
                max-width: none;
                min-height: 62px;
                padding: 6px 18px;
                border-radius: 0;
                box-shadow: 0 4px 16px rgba(60, 26, 10, .10);
            }

            .nav-logo {
                height: 50px;
            }

            .nav-links {
                display: none;
            }

            .nav-ham {
                display: flex;
            }

            .page-head {
                padding: 34px 0 22px;
            }

            .contact-card {
                padding: 34px 22px 36px;
            }

            .contact-form {
                max-width: 100%;
            }

            .contact-info-card {
                padding: 34px 22px;
            }

            .map-box {
                height: 230px;
            }

            .ft {
                padding: 50px 0 42px;
            }

            .ft-inner {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }

            .ft-social {
                justify-content: center;
            }

            .ft-logo {
                height: 58px;
            }

            .ft-nav {
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <!-- MOBILE DRAWER -->
    <nav class="mob-nav" id="mob-nav">
        <button class="mob-close" id="mob-close">&times;</button>
        <a href="ventas.html" onclick="closeMob()">Ventas</a>
        <a href="alquileres.html" onclick="closeMob()">Alquileres</a>
        <a href="sobre-nosotros.html" onclick="closeMob()">Sobre Nosotros</a>
        <a href="contacto.html" onclick="closeMob()">Contacto</a>
    </nav>

    <!-- HEADER -->
    <header class="hd">
        <div class="nav">
            <a href="index.html" aria-label="Terra Homes inicio">
                <img class="nav-logo" src="imgs/MARRON.png" alt="Terra Homes Real Estate">
            </a>

            <ul class="nav-links">
                <li><a href="ventas.html">Ventas</a></li>
                <li><a href="alquileres.html">Alquileres</a></li>
                <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>

            <button class="nav-ham" id="nav-ham" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main>

        <!-- TITLE -->
        <section class="page-head">
            <div class="wrap">
                <h1 class="page-title">Contacto</h1>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-section">
            <div class="narrow-wrap">
                <div class="contact-card">

                    <form class="contact-form" onsubmit="return false;">
                        <div class="field">
                            <label for="name">Nombre</label>
                            <input id="name" type="text">
                        </div>

                        <div class="field">
                            <label for="surname">Apellido</label>
                            <input id="surname" type="text">
                        </div>

                        <div class="field">
                            <label for="email">E-mail</label>
                            <input id="email" type="email">
                        </div>

                        <div class="field">
                            <label for="message">Mensaje</label>
                            <textarea id="message"></textarea>
                        </div>

                        <label class="check-row">
                            <input type="checkbox">
                            <span>He leído y acepto la Política de Privacidad</span>
                        </label>

                        <label class="check-row">
                            <input type="checkbox">
                            <span>Quiero recibir comunicaciones de Terra Homes</span>
                        </label>

                        <button class="form-submit" type="submit">Enviar</button>
                    </form>

                </div>
            </div>
        </section>

        <!-- CONTACT INFO -->
        <section class="contact-info-section">
            <div class="narrow-wrap">
                <div class="contact-info-card">

                    <div class="info-block">
                        <h2 class="info-title">Dirección:</h2>
                        <p class="info-text">
                            Calle Alcalá, 85 5º Dcha<br>
                            28009 Madrid (Madrid)
                        </p>
                    </div>

                    <div class="info-block">
                        <h2 class="info-title">Teléfono:</h2>
                        <p class="info-text">
                            <a class="info-link" href="tel:+34913608853">+34 913 608 853</a><br>
                            <a class="info-link" href="tel:+34606457314">+34 606 457 314</a>
                        </p>
                    </div>

                    <div class="info-block">
                        <h2 class="info-title">E-mail:</h2>
                        <p class="info-text">
                            <a class="info-link" href="mailto:hola@terrahomes.es">hola@terrahomes.es</a>
                        </p>
                    </div>

                </div>
            </div>
        </section>

        <!-- MAP -->
        <section class="map-section">
            <div class="wrap">
                <div class="map-box">
                    <img src="imgs/mapa.png" alt="Mapa Terra Homes Calle Alcalá 85 Madrid">
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="ft">
        <div class="wrap">
            <div class="ft-inner">

                <div class="ft-social">
                    <a href="#" class="ft-soc-btn" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24">

                        </svg>
                    </a>

                    <a href="#" class="ft-soc-btn" aria-label="Facebook">
                        <svg viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                        </svg>
                    </a>

                    <a href="#" class="ft-soc-btn" aria-label="Instagram">

                        </svg>
                    </a>

                    <a href="#" class="ft-soc-btn" aria-label="Idealista">
                        <span class="ft-soc-id">id</span>
                    </a>
                </div>

                <div class="ft-logo-wrap">
                    <img class="ft-logo" src="imgs/MARRON.png" alt="Terra Homes Real Estate">
                </div>

                <nav class="ft-nav" aria-label="Footer nav">
                    <a href="ventas.html">Ventas</a>
                    <a href="alquileres.html">Alquileres</a>
                    <a href="sobre-nosotros.html">Sobre Nosotros</a>
                    <a href="contacto.html">Contacto</a>
                </nav>

            </div>
        </div>
    </footer>

    <script>
        const mobNav = document.getElementById('mob-nav');

        function closeMob() {
            mobNav.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('nav-ham').addEventListener('click', () => {
            mobNav.classList.add('open');
            document.body.style.overflow = 'hidden';
        });

        document.getElementById('mob-close').addEventListener('click', closeMob);
    </script>

</body>
</html>
